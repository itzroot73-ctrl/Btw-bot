<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Bot Nexus - Minecraft Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#050505] text-white overflow-hidden h-screen flex flex-col">
    <!-- Header -->
    <header class="h-16 glass flex items-center justify-between px-6 z-10">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-bold">A</div>
            <h1 class="text-xl font-semibold tracking-tight">Aether <span class="text-indigo-500 font-bold">Nexus</span></h1>
        </div>
        <div class="flex items-center space-x-4">
            <button id="add-bot-trigger" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-md text-sm font-medium transition-colors">Add Bot</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar: Bot List -->
        <aside class="w-72 glass border-t-0 flex flex-col">
            <div class="p-4 border-b border-white/10">
                <div id="category-filters" class="flex flex-wrap gap-2">
                    <!-- Filters dynamically added -->
                </div>
            </div>
            <div id="bots-grid" class="flex-1 overflow-y-auto p-4 space-y-2">
                <!-- Bots dynamically added -->
            </div>
        </aside>

        <!-- Main Area -->
        <main class="flex-1 flex flex-col relative bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
            <div id="no-bot-selected" class="absolute inset-0 flex flex-center items-center justify-center z-0">
                <div class="text-center">
                    <div class="w-20 h-20 bg-indigo-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-500/20">
                        <svg class="w-10 h-10 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <h2 class="text-2xl font-bold text-white/40">Select a Bot to Interact</h2>
                    <p class="text-white/20">Manage your Minecraft fleet from a single interface</p>
                </div>
            </div>

            <div id="chat-container" class="hidden flex-1 flex flex-col p-6 z-0">
                <div id="active-bot-header" class="mb-6 flex items-center justify-between glass p-4 rounded-xl">
                    <div class="flex items-center space-x-4">
                        <div id="bot-status-indicator" class="w-3 h-3 rounded-full bg-gray-500"></div>
                        <div>
                            <h2 id="active-bot-name" class="font-bold text-lg leading-tight">Bot Name</h2>
                            <p id="active-bot-ip" class="text-xs text-white/40">play.bananasmp.net:25565</p>
                        </div>
                    </div>
                    <button id="remove-bot-btn" class="text-red-500/60 hover:text-red-500 text-xs font-medium uppercase tracking-wider transition-colors">Remove Bot</button>
                </div>

                <div id="chat-window" class="flex-1 overflow-y-auto mb-6 space-y-2 fira-code text-sm">
                    <!-- Messages -->
                </div>

                <div class="flex items-center space-x-3">
                    <input type="text" id="chat-input" placeholder="Enter command or message..." class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500/50 transition-colors fira-code" disabled>
                    <button id="send-chat-btn" class="bg-indigo-600 hover:bg-indigo-700 w-12 h-12 flex items-center justify-center rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: Add Bot -->
    <div id="add-bot-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="glass max-w-md w-full rounded-2xl shadow-2xl p-8 relative">
            <button id="close-modal" class="absolute top-6 right-6 text-white/40 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h3 class="text-2xl font-bold mb-6">Deploy New Unit</h3>
            <form id="add-bot-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-white/40 mb-2">Bot Username</label>
                    <input type="text" id="username" placeholder="Aether_01" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 outline-none focus:border-indigo-500/50 transition-colors">
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div class="col-span-2">
                        <label class="block text-xs font-bold uppercase tracking-widest text-white/40 mb-2">Server Host</label>
                        <input type="text" id="host" placeholder="play.bananasmp.net" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 outline-none focus:border-indigo-500/50 transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-widest text-white/40 mb-2">Port</label>
                        <input type="number" id="port" placeholder="25565" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 outline-none focus:border-indigo-500/50 transition-colors">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-white/40 mb-2">Operation Group</label>
                    <input type="text" id="category" placeholder="Surveillance" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 outline-none focus:border-indigo-500/50 transition-colors">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 py-4 rounded-lg font-bold text-lg mt-4 transition-all hover:scale-[1.02] active:scale-[0.98]">Initialize Deployment</button>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
