<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS BOT - Neural Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#000000] text-white overflow-hidden h-screen flex flex-col uppercase tracking-[0.15em] font-bold">
    <!-- Header -->
    <header class="h-20 border-b border-white/5 flex items-center justify-between px-8 z-10 bg-black">
        <div class="flex items-center space-x-5">
            <div class="w-10 h-10 bg-white rounded flex items-center justify-center font-black text-black text-xl">B</div>
            <div>
                <h1 class="text-lg font-black tracking-[0.25em] leading-none">NEXUS BOT</h1>
                <div class="flex items-center space-x-2 mt-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-red-500 shadow-[0_0_5px_#ef4444]"></span>
                    <span class="text-[7px] text-white/40 font-bold tracking-[0.1em]">CONNECTING TO CORE...</span>
                </div>
            </div>
        </div>
        <button id="add-bot-trigger" class="bg-white hover:bg-gray-200 text-black px-6 py-2 rounded-full text-[9px] font-black tracking-[0.1em] transition-all">
            + NEW INSTANCE
        </button>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-80 border-r border-white/5 flex flex-col bg-black">
            <div class="p-6 pb-2">
                <div class="flex items-center justify-between mb-8">
                    <div class="flex items-center space-x-2 text-white/30">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        <h2 class="text-[8px] font-black tracking-[0.2em]">FLEET OVERVIEW (<span id="bot-count">0</span>)</h2>
                    </div>
                    <svg class="w-3 h-3 text-white/10 cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </div>

                <!-- Category Filters -->
                <div id="category-filters" class="flex space-x-4 mb-6 overflow-x-auto no-scrollbar pb-2">
                    <button class="filter-btn active text-[7px] font-black tracking-[0.2em] text-white whitespace-nowrap" data-category="ALL">ALL</button>
                </div>
            </div>

            <div id="bots-grid" class="flex-1 overflow-y-auto px-6 space-y-3 pb-6">
                <!-- Empty State -->
                <div id="empty-sidebar" class="h-32 border border-white/5 rounded-xl flex flex-col items-center justify-center space-y-4 opacity-20">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 5v-2M15 5v-2M9 19v2M15 19v2M5 9h-2M5 15h-2M19 9h2M19 15h2M9 9h6v6h-6z"/></svg>
                    <span class="text-[7px] font-black tracking-[0.2em]">NO UNITS DEPLOYED</span>
                </div>
            </div>
        </aside>

        <!-- Main Area -->
        <main class="flex-1 flex flex-col relative">
            <!-- Background Grid -->
            <div class="absolute inset-0 grid-bg opacity-30 pointer-events-none"></div>

            <!-- Idle State -->
            <div id="no-bot-selected" class="absolute inset-0 flex flex-col items-center justify-center z-10 transition-all duration-700">
                <div class="w-24 h-24 bg-white/[0.03] rounded-[2rem] flex items-center justify-center mb-10 border border-white/10 shadow-[0_0_30px_rgba(255,255,255,0.02)]">
                    <svg class="w-10 h-10 text-white/10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 5v-2M15 5v-2M9 19v2M15 19v2M5 9h-2M5 15h-2M19 9h2M19 15h2M9 9h6v6h-6z"/></svg>
                </div>
                <h2 class="text-3xl font-black text-white tracking-[0.6em] mb-4">NEURAL GATEWAY IDLE</h2>
                <p class="text-[8px] text-white/20 max-w-xs text-center font-black leading-loose tracking-[0.25em]">
                    SELECT A CORE INSTANCE FROM THE SIDEBAR TO ESTABLISH A HIGH-BANDWIDTH UPLINK
                </p>
            </div>

            <!-- Active Interface -->
            <div id="chat-container" class="hidden opacity-0 flex-1 flex flex-col p-10 z-20 transition-all duration-700">
                <!-- Chat header and window as before but refined -->
                <div id="active-bot-header" class="mb-10 flex items-center justify-between border border-white/5 p-6 rounded-2xl bg-white/[0.01]">
                    <div class="flex items-center space-x-6">
                        <div id="bot-status-indicator" class="w-2 h-2 rounded-full bg-white"></div>
                        <div>
                            <h2 id="active-bot-name" class="font-black text-xl tracking-[0.15em] leading-none mb-2">BOT_UNIT</h2>
                            <p id="active-bot-ip" class="text-[8px] text-white/20 font-black tracking-[0.2em]">UPLINK: 0.0.0.0:00000</p>
                        </div>
                    </div>
                    <button id="remove-bot-btn" class="text-white/20 hover:text-red-500 text-[8px] font-black tracking-[0.2em] transition-colors">DECOMMISSION UNIT</button>
                </div>

                <div id="chat-window" class="flex-1 overflow-y-auto mb-10 space-y-3 fira-code text-[11px] leading-relaxed text-white/60">
                    <!-- Logs -->
                </div>

                <div class="flex items-center space-x-4">
                    <div class="flex-1 relative group">
                        <input type="text" id="chat-input" placeholder="AUTHORIZE COMMAND EXECUTION..." class="w-full bg-white/[0.02] border border-white/5 rounded-2xl px-6 py-4 outline-none focus:border-white/20 transition-all fira-code text-[10px] placeholder:text-white/10" disabled>
                        <div class="absolute right-6 top-1/2 -translate-y-1/2 text-[7px] text-white/10 font-black tracking-[0.2em]">READY</div>
                    </div>
                    <button id="send-chat-btn" class="bg-white hover:bg-gray-100 text-black w-14 h-14 flex items-center justify-center rounded-2xl transition-all disabled:opacity-10" disabled>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="add-bot-modal" class="hidden fixed inset-0 bg-black/98 z-50 flex items-center justify-center p-6">
        <div class="max-w-md w-full border border-white/10 rounded-3xl p-10 bg-black">
            <div class="flex justify-between items-center mb-10">
                <h3 class="text-sm font-black tracking-[0.3em]">UNIT AUTHORIZATION</h3>
                <button id="close-modal" class="text-white/20 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="add-bot-form" class="space-y-8">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[8px] font-black tracking-[0.3em] text-white/20 mb-4">UNIT IDENTIFIER</label>
                        <input type="text" id="username" placeholder="CORE_NULL_01" class="w-full bg-white/[0.02] border border-white/5 rounded-xl px-5 py-4 outline-none focus:border-white/20 transition-all text-[10px]">
                    </div>
                    <div>
                        <label class="block text-[8px] font-black tracking-[0.3em] text-white/20 mb-4">CATEGORY</label>
                        <input type="text" id="category" placeholder="NEURAL_GRID" class="w-full bg-white/[0.02] border border-white/5 rounded-xl px-5 py-4 outline-none focus:border-white/20 transition-all text-[10px]">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-6">
                    <div class="col-span-2">
                        <label class="block text-[8px] font-black tracking-[0.3em] text-white/20 mb-4">TARGET UPLINK</label>
                        <input type="text" id="host" placeholder="PLAY.BANANASMP.NET" class="w-full bg-white/[0.02] border border-white/5 rounded-xl px-5 py-4 outline-none focus:border-white/20 transition-all text-[10px]">
                    </div>
                    <div>
                        <label class="block text-[8px] font-black tracking-[0.3em] text-white/20 mb-4">PORT</label>
                        <input type="number" id="port" placeholder="25565" class="w-full bg-white/[0.02] border border-white/5 rounded-xl px-5 py-4 outline-none focus:border-white/20 transition-all text-[10px]">
                    </div>
                </div>
                <button type="submit" class="w-full bg-white hover:bg-gray-100 text-black py-5 rounded-2xl font-black text-[10px] tracking-[0.4em] mt-4 shadow-2xl shadow-white/5">INITIALIZE DEPLOYMENT</button>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
